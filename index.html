<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />

      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#1c6b52" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PropScout" />
    <meta
      name="description"
      content="Everything for a property hunt in one place: what each one really costs, how much room you have to negotiate, what to check on site, and somewhere to keep the photos. Works offline. No account."

    <meta property="og:site_name" content="PropScout" />
    <meta property="og:title" content="PropScout — property visits, offline" />
    <meta
      property="og:description"
      content="The shortlist, what each one really costs, how much room you have to negotiate, and a checklist for when you are standing there. Add it to your home screen — it works with no signal."
    />
    <meta
      property="og:image"
      content="https://abhaysharma177-commits.github.io/propscout/icons/social-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PropScout" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PropScout — property visits, offline" />
    <meta
      name="twitter:description"
      content="The shortlist, real costs, negotiation room and an on-site checklist. Works offline, no account."
    />
    <meta
      name="twitter:image"
      content="https://abhaysharma177-commits.github.io/propscout/icons/social-card.png"
    />
  </head>

    <div id="root"></div>
    <noscript>PropScout needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
